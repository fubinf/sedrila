{% extends "base.html" %}
{% block mainpart %}
  <div class="pagetype-taskgroup">
      {{ content }}

      {% if taskgroup_diagram_file %}
      <div class="taskgroup-overview-diagram-container">
        <img class="taskgroup-overview-diagram" src="{{ taskgroup_diagram_file }}" alt="taskgroup overview">
        <p class="taskgroup-overview-diagram-solo"><a href="{{ taskgroup_diagram_file }}">View solo</a></p>
      </div>
      {% endif %}
  </div>
{% endblock %}
