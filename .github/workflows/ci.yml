name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']  # oldest supported and newest released
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install tox
        run: pip install tox tox-gh-actions
      - name: Ensure a git identity exists
        run: |
          git config --global --get user.name  || git config --global user.name  "SeDriLa CI"
          git config --global --get user.email || git config --global user.email "ci@example.org"
      - name: Run tests
        run: tox
