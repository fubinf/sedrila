# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[build-system]
# https://hatch.pypa.io/latest/config/build/
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sedrila"
version = "3.2.0"
description = "Tool infrastructure for building and running \"self-driven lab\" courses"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lutz Prechelt", email = "prechelt@inf.fu-berlin.de" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["static site generator", "learning management system"]
classifiers = [  # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Operating System :: Unix",
    "Topic :: Database",
    "Topic :: Documentation",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    # uv tree --outdated --depth 1  # check for newer packages
    # uv lock --upgrade && uv sync  # upgrade everything
    # uv lock --upgrade-package PACKAGENAME && uv sync  # upgrade selectively
    "argparse_subcommand>=1.2,<2",
    "blessed>=1.20,<2",
    "bottle>=0.13,<0.14",
    "click>=8.3,<9",
    "GitPython>=3.1,<4",
    "graphviz>=0.20,<0.21",
    "Jinja2>=3.1,<4",
    "jsonschema>=4.26,<5",
    "Markdown>=3.7,<4",
    "matplotlib>=3.9,<4",
    "mdx_linkify>=2.1,<3",
    "pandas>=3.0,<4",
    "Pygments>=2.17,<3",
    "python-gnupg>=0.5.5,<0.6",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "rich>=15.0,<16",
    "waitress>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/fubinf/sedrila"
Documentation = "https://sedrila.readthedocs.io/"
Repository = "https://github.com/fubinf/sedrila"

[project.scripts]
sedrila = "sedrila.__main__:main"

[dependency-groups]  # 'uv sync' installs group 'dev' by default
# https://packaging.python.org/en/latest/specifications/dependency-groups/
dev = [  # ordered alphabetically
    "beautifulsoup4>=4.12,<5",
    "html5lib>=1.1,<2",
    "import-linter>=2.15,<3",
    "mkdocs>=1.6,<2",
    "pytest>=9.1,<10",
]

[tool.uv]
# https://docs.astral.sh/uv/reference/settings/
# curl -LsSf https://astral.sh/uv/install.sh | sh  # install uv into ~/.local/bin
# uv self update  # update uv

[tool.hatch.build.targets.wheel]
# https://hatch.pypa.io/latest/config/build/#file-selection
# uv build  # creates sdist and wheel in dist/
# uv publish  # with  export UV_PUBLISH_TOKEN=<PyPI API token>  or  --token <token>
packages = ["sedrila"]
exclude = [  # test code and data are not part of the distribution
    "sedrila/tests",
    "sedrila/cmd/tests",
]

[tool.hatch.build.targets.sdist]
include = ["sedrila", "README.md", "LICENSE", "pyproject.toml"]
exclude = [
    "sedrila/tests",
    "sedrila/cmd/tests",
]

[tool.pytest.ini_options]
# https://docs.pytest.org/en/latest/reference/customize.html
testpaths = ["sedrila"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311, py314
isolated_build = true

[testenv]
deps =
    pytest>=8.3
    beautifulsoup4>=4.12
    html5lib>=1.1
commands = pytest

[gh-actions]
python =
    3.11: py311
    3.14: py314
"""

[tool.importlinter]
# run with 'lint-imports' or 'import-linter lint'
# https://import-linter.readthedocs.io/en/stable/contract_types.html
root_package = "sedrila"

[[tool.importlinter.contracts]]
name = "SeDriLa layering"
type = "layers"
layers = [
    # Layers listed highest to lowest; 'a | b' means 'independent' (may not import), 'a : b' means 'siblings' (may import)
    # Modules not listed are unconstrained.
    "sedrila.__main__",  # L6: main
    "sedrila.cmd.author : sedrila.cmd.student : sedrila.cmd.instructor : sedrila.cmd.maintainer : sedrila.cmd.evaluator : sedrila.cmd.server : sedrila.cmd.cli",  # L5.2: commands
    "sedrila.subcmd.rename | sedrila.webapp",  # L5.1: subcommands
    "sedrila.course.course : sedrila.course.coursebuilder : sedrila.course.course_si : sedrila.course.participant : sedrila.course.programchecker : sedrila.course.repo : sedrila.course.glossary : sedrila.course.report",  # L4: course
    "sedrila.framework.macros : sedrila.framework.markdown : sedrila.framework.elements : sedrila.framework.directory : sedrila.framework.partbuilder : sedrila.framework.macroexpanders",  # L3: framework
    "sedrila.mech.replacements | sedrila.mech.snippetchecker | sedrila.mech.linkchecker | sedrila.mech.protocolchecker",  # L2.3: mechanisms
    "sedrila.base2.argparser",  # L2.2: mechanisms base 
    "sedrila.base2.constants : sedrila.base2.html",  # L2.1: domain base
    "sedrila.base.cache | sedrila.base.sgit | sedrila.base.mycrypt",  # L1: domain-independent utils
    "sedrila.base.base", # L0: generic utils
]
ignore_imports = [
    # Function-level ("lazy") imports violating the layering, ignored for now: import-linter sees them like any
    # top-level import, but they are mostly workarounds for import cycles. Top-level violations are NOT listed here.
    # If one of these entries stops matching (import removed), import-linter complains; delete the entry then.
    "sedrila.framework.directory -> sedrila.course.course",
    "sedrila.framework.directory -> sedrila.course.coursebuilder",
    "sedrila.framework.directory -> sedrila.course.glossary",
    "sedrila.framework.elements -> sedrila.course.course",
    "sedrila.framework.partbuilder -> sedrila.course.course",
    "sedrila.framework.partbuilder -> sedrila.course.coursebuilder",
    "sedrila.framework.macroexpanders -> sedrila.course.course",
    "sedrila.framework.macroexpanders -> sedrila.course.coursebuilder",
    "sedrila.framework.macroexpanders -> sedrila.course.programchecker",
    "sedrila.mech.snippetchecker -> sedrila.framework.macros",
]
